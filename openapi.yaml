openapi: 3.0.3

info:
  title: Ромашка - API системы отчетности
  description: |
    REST API системы отчетности для сети ресторанов "Ромашка".

    Разделы:
    * **Форматы** - список форматов для построения отчетов;
    * **Отчеты** - получение отчета по доменной сущности в формате по умолчанию;
    * **Доменные сущности** - CRUD операции над сущностями хранилища;
    * **Фильтрация** - поиск сущностей по Dto-условию, включая вложенные структуры;
    * **ОСВ** - оборотно-сальдовая ведомость с учетом фильтрации.

    При изменении и удалении доменных сущностей выполняется проверка
    ссылочной целостности: запрещено удалять сущность или менять ее код,
    если на нее ссылаются другие доменные сущности.
  version: "1.0.0"

servers:
  - url: /

tags:
  - name: formats
    description: Форматы построения отчетов
  - name: reports
    description: Построение отчетов
  - name: entities
    description: CRUD операции с доменными сущностями
  - name: filter
    description: Фильтрация доменных сущностей
  - name: osv
    description: Оборотно-сальдовая ведомость

paths:

  /api/formats:
    get:
      tags: [formats]
      operationId: main.get_formats
      summary: Получить список всех форматов для построения отчетов
      description: Возвращает JSON список доступных форматов (код, наименование, mime тип, признак формата по умолчанию)
      responses:
        "200":
          description: Список форматов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportFormat"

  /api/get_default_report:
    get:
      tags: [reports]
      operationId: main.get_default_report
      summary: Получить отчет в формате по умолчанию
      description: Строит отчет по доменной сущности в формате, заданном настройками приложения
      parameters:
        - name: entity
          in: query
          required: true
          description: Ключ доменной сущности (например range_model)
          schema:
            type: string
        - name: unique_code
          in: query
          required: true
          description: Уникальный код сущности
          schema:
            type: string
      responses:
        "200":
          description: Отчет
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Сущность не найдена
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Ошибка построения отчета
          content:
            text/plain:
              schema:
                type: string

  /api/entities:
    get:
      tags: [entities]
      operationId: main.get_entities
      summary: Получить список доменных сущностей
      description: Возвращает JSON список ключей доменных сущностей и их описаний
      responses:
        "200":
          description: Список доменных сущностей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityInfo"

  /api/entities/{entity}:
    get:
      tags: [entities]
      operationId: main.get_entity_list
      summary: Получить список сущностей указанного типа
      parameters:
        - $ref: "#/components/parameters/entity"
      responses:
        "200":
          description: Список сущностей в формате Json
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [entities]
      operationId: main.create_entity
      summary: Добавить новую доменную сущность
      description: |
        Создает сущность из тела запроса. Если маркер `type` не указан,
        он определяется по ключу коллекции. Ссылки `*_code` разрешаются
        по существующим сущностям хранилища.
      parameters:
        - $ref: "#/components/parameters/entity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          description: Сущность создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/entities/{entity}/filter:
    post:
      tags: [filter]
      operationId: main.filter_entity
      summary: Отфильтровать сущности указанного типа
      description: |
        Выполняет поиск доменных сущностей по Dto-условию фильтрации.
        Тип DOMAIN-модели задается в Route (`entity`), тело запроса
        содержит условия `field`, `value` и `type` (EQUALS или LIKE).

        Поле `field` может указывать на вложенные структуры через точку:
        * `name`, `unique_code` - поля самой сущности;
        * `base.name`, `base.unique_code` - базовая единица измерения;
        * `group.name`, `group.unique_code` - группа номенклатуры;
        * `parent.name`, `parent.unique_code` - группа-владелец;
        * `range.name`, `range.unique_code` - единица измерения.
      parameters:
        - $ref: "#/components/parameters/entity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Filter"
      responses:
        "200":
          description: Список сущностей, удовлетворяющих условию
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/entities/{entity}/{unique_code}:
    get:
      tags: [entities]
      operationId: main.get_entity
      summary: Получить доменную сущность по уникальному коду
      parameters:
        - $ref: "#/components/parameters/entity"
        - $ref: "#/components/parameters/unique_code"
      responses:
        "200":
          description: Сущность
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [entities]
      operationId: main.update_entity
      summary: Изменить доменную сущность
      description: |
        Изменяются только поля, переданные в теле запроса.
        Изменение уникального кода запрещено, если сущность связана
        с другой доменной сущностью.
      parameters:
        - $ref: "#/components/parameters/entity"
        - $ref: "#/components/parameters/unique_code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          description: Сущность изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [entities]
      operationId: main.delete_entity
      summary: Удалить доменную сущность
      description: |
        Удаление запрещено, если на сущность ссылаются другие
        доменные сущности (возвращается код 409).
      parameters:
        - $ref: "#/components/parameters/entity"
        - $ref: "#/components/parameters/unique_code"
      responses:
        "204":
          description: Сущность удалена
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/osv:
    post:
      tags: [osv]
      operationId: main.post_osv
      summary: Построить оборотно-сальдовую ведомость с учетом фильтрации
      description: |
        На вход передается Dto модели фильтрации:
        `entity` (тип DOMAIN-модели), `field`, `value` и `type` (EQUALS или LIKE).

        Возвращается оборотно-сальдовая ведомость (ОСВ):
        строки по отфильтрованным сущностям и итоги.

        Формирование выполняется сервисом `osv_service`:
        исходные данные менеджера → начальные остатки →
        отбор строк через универсальный прототип `filter_prototype` →
        движения (приход/расход) → сборка DTO.

        Показатели строк:
        * **receipt_model** - приход (Дт) = брутто, расход (Кт) = нетто;
        * **range_model** - приход (Дт) = коэффициент пересчета;
        * **nomenclature_model** - приход (Дт) = коэффициент единицы измерения;
        * **group_model** - обороты отсутствуют.

        Сальдо на конец: конечное = начальное + Дт - Кт
        (в сторону Дт или Кт).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Filter"
      responses:
        "200":
          description: Оборотно-сальдовая ведомость
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Osv"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  parameters:
    entity:
      name: entity
      in: path
      required: true
      description: Ключ доменной сущности
      schema:
        type: string
    unique_code:
      name: unique_code
      in: path
      required: true
      description: Уникальный код сущности
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Сущность не найдена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Конфликт: сущность связана с другими доменными сущностями
        либо код уже используется
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    ReportFormat:
      type: object
      description: Формат для построения отчетов
      properties:
        code:
          type: integer
          description: Код формата
        name:
          type: string
          description: Наименование формата
        content_type:
          type: string
          nullable: true
          description: Mime тип результата
        is_default:
          type: boolean
          description: Признак формата по умолчанию
      required:
        - code
        - name
        - is_default

    EntityInfo:
      type: object
      description: Описание доменной сущности
      properties:
        key:
          type: string
          description: Ключ коллекции (имя доменной модели)
        description:
          type: string
          description: Описание сущности
      required:
        - key
        - description

    Entity:
      type: object
      description: |
        Плоское представление доменной сущности.
        Ссылки на другие сущности передаются их уникальными кодами
        в полях вида "*_code".
        При создании маркер type может быть не указан - он определяется
        по ключу коллекции. При изменении достаточно передать изменяемые поля
      additionalProperties: true
      properties:
        type:
          type: string
          description: Полное имя типа доменной модели
        unique_code:
          type: string
          description: Уникальный код сущности
        name:
          type: string
          description: Наименование

    Error:
      type: object
      description: Ошибка выполнения операции
      properties:
        message:
          type: string
          description: Описание ошибки
      required:
        - message

    Filter:
      type: object
      description: |
        Dto-условие фильтрации доменных сущностей.
        Тип сущности задается в Route, в теле - только условия по полям.
      properties:
        field:
          type: string
          description: |
            Поле или путь вложенной структуры:
            name, unique_code, base.name, group.name, parent.name, range.name и т.д.
          example: base.name
        value:
          type: string
          description: Значение для сравнения
          example: Грамм
        type:
          type: string
          description: Вариант сравнения
          enum:
            - EQUALS
            - LIKE
          default: EQUALS
        entity:
          type: string
          description: |
            Необязательный ключ сущности. Если указан,
            должен совпадать с типом из Route
          example: range_model
      required:
        - field
        - value

    OsvRow:
      type: object
      description: Строка оборотно-сальдовой ведомости
      properties:
        entity:
          type: string
          description: Тип доменной сущности
        unique_code:
          type: string
          description: Уникальный код сущности
        name:
          type: string
          description: Наименование
        opening_debit:
          type: number
          format: float
          description: Сальдо на начало, дебет
        opening_credit:
          type: number
          format: float
          description: Сальдо на начало, кредит
        turnover_debit:
          type: number
          format: float
          description: Оборот за период, дебет
        turnover_credit:
          type: number
          format: float
          description: Оборот за период, кредит
        closing_debit:
          type: number
          format: float
          description: Сальдо на конец, дебет
        closing_credit:
          type: number
          format: float
          description: Сальдо на конец, кредит
      required:
        - entity
        - unique_code
        - name
        - opening_debit
        - opening_credit
        - turnover_debit
        - turnover_credit
        - closing_debit
        - closing_credit

    OsvTotals:
      type: object
      description: Итоги оборотно-сальдовой ведомости
      properties:
        opening_debit:
          type: number
          format: float
          description: Итого сальдо на начало, дебет
        opening_credit:
          type: number
          format: float
          description: Итого сальдо на начало, кредит
        turnover_debit:
          type: number
          format: float
          description: Итого оборот, дебет
        turnover_credit:
          type: number
          format: float
          description: Итого оборот, кредит
        closing_debit:
          type: number
          format: float
          description: Итого сальдо на конец, дебет
        closing_credit:
          type: number
          format: float
          description: Итого сальдо на конец, кредит
      required:
        - opening_debit
        - opening_credit
        - turnover_debit
        - turnover_credit
        - closing_debit
        - closing_credit

    Osv:
      type: object
      description: Оборотно-сальдовая ведомость с учетом фильтрации
      properties:
        entity:
          type: string
          description: Ключ доменной сущности
          example: receipt_model
        rows:
          type: array
          description: Строки ведомости
          items:
            $ref: "#/components/schemas/OsvRow"
        totals:
          $ref: "#/components/schemas/OsvTotals"
      required:
        - entity
        - rows
        - totals
